<script>
  (() => {
    const navigation = performance.getEntriesByType('navigation')[0];
    const legacyNavigationType = performance.navigation?.type;
    const isReload = navigation?.type === 'reload' || (!navigation && legacyNavigationType === 1);
    const isBackForward = navigation?.type === 'back_forward' || legacyNavigationType === 2;
    let hasSameOriginReferrer = false;

    try {
      hasSameOriginReferrer = Boolean(document.referrer) && new URL(document.referrer).origin === window.location.origin;
    } catch {}

    const isInitialVisit = (!navigation || navigation.type === 'navigate') && !hasSameOriginReferrer;
    if (!isBackForward && (isReload || isInitialVisit)) {
      document.documentElement.classList.add('has-site-loader');
    }
  })();
</script>
<div class="site-loader" data-site-loader role="status" aria-live="polite" aria-label="Loading emmandev.com">
  <div class="site-loader-content">
    <img class="site-loader-logo" src="https://assets.cdn.filesafe.space/XlExwEOaS3a62QuZvpH4/media/6abf56202c503e697d49da68.png" alt="">
    <span class="site-loader-status">Initializing Systems</span>
    <span class="site-loader-track" aria-hidden="true"></span>
  </div>
</div>

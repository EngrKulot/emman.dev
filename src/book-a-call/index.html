<head>

  <meta charset="UTF-8">

  <meta name="description" content="Book a discovery call with Emman Sadiang-abay for websites, funnels, CRM, and automation systems.">
  <title>Book a Call | Emman Sadiang-abay</title>
  <link rel="icon" type="image/png" href="https://assets.cdn.filesafe.space/XlExwEOaS3a62QuZvpH4/media/6ac388ee2c1c51a2ac63f1a7.png">
  <style>
    :root {
      --bg: #05080a;
      --bg-2: #071014;
      --ink: #f7f4ed;
      --muted: rgba(247, 244, 237, 0.68);
      --line: rgba(194, 222, 238, 0.2);
      --line-soft: rgba(194, 222, 238, 0.1);
      --blueprint: rgba(122, 178, 205, 0.45);
      --orange: #ff7a00;
      --orange-2: #f05200;
      --container: 1440px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
button:focus-visible {
      outline: 3px solid rgba(255, 122, 0, 0.72);
      outline-offset: 4px;
    }

    .booking-hero {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      padding: 78px 0 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 38%, rgba(255, 122, 0, 0.1), transparent 28%),
        linear-gradient(120deg, #050607, var(--bg-2) 54%, #030506);
    }

    .booking-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(rgba(122, 178, 205, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 178, 205, 0.055) 1px, transparent 1px),
        linear-gradient(rgba(122, 178, 205, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 178, 205, 0.018) 1px, transparent 1px);
      background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
      animation: gridDrift 42s linear infinite;
      mask-image: radial-gradient(circle at 50% 46%, black, transparent 88%);
      pointer-events: none;
    }

    .booking-hero::after {
      content: "";
      position: absolute;
      inset: 104px 34px 34px;
      z-index: -1;
      border: 1px solid rgba(122, 178, 205, 0.16);
      pointer-events: none;
    }

    .booking-shell {
      width: min(calc(100% - 64px), 1280px);
      min-height: calc(100svh - 78px);
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(76px, 8vw, 118px);
      padding: clamp(80px, 10vw, 132px) 0 clamp(84px, 9vw, 124px);
    }

    .booking-copy,
.booking-calendar {
      width: 100%;
      display: grid;
      justify-items: center;
    }

    .booking-copy {
      text-align: center;
    }

    .booking-kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: min(100%, 460px);
      margin: 0 0 44px;
      color: var(--orange);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .booking-kicker::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 122, 0, 0.68), rgba(122, 178, 205, 0.18), transparent);
    }

    .booking-kicker::before {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(122, 178, 205, 0.18), rgba(255, 122, 0, 0.68));
    }

    .booking-copy h1 {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 5.4vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .booking-copy h1 span {
      color: var(--orange);
      text-shadow: 0 0 42px rgba(255, 122, 0, 0.18);
    }

    .calendar-frame {
      position: relative;
      width: min(100%, 1040px);
      padding: clamp(14px, 1.6vw, 22px);
      border: 1px solid #2a2f36;
      background:
        linear-gradient(rgba(122, 178, 205, 0.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 178, 205, 0.014) 1px, transparent 1px),
        #0b0f12;
      background-size: 24px 24px;
      box-shadow: none;
      overflow: hidden;
    }

    .calendar-frame::before,
.calendar-frame::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(255, 122, 0, 0.42);
      pointer-events: none;
    }

    .calendar-frame::before {
      top: -6px;
      left: -6px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .calendar-frame::after {
      right: -6px;
      bottom: -6px;
      border-right: 1px solid;
      border-bottom: 1px solid;
    }

    .calendar-embed-crop {
      width: 100%;
      height: 650px;
      overflow: hidden;
      background: #0b0f12;
    }

    .calendar-frame iframe {
      display: block;
      width: 100%;
      height: 960px !important;
      min-height: 960px;
      border: 0;
      background: #0b0f12;
      transform: translateY(-96px);
      transform-origin: top center;
    }

    @keyframes gridDrift {
      0% {
        background-position: 0 0, 0 0, 16px 16px, 16px 16px;
      }

      100% {
        background-position: 96px 96px, 96px 96px, 40px 40px, 40px 40px;
      }
    }

    @media (max-width: 1120px) {
      .booking-shell {
        width: min(calc(100% - 40px), 980px);
      }

      .calendar-frame {
        width: 100%;
      }





    }

    @media (max-width: 760px) {
      .booking-hero {
        padding-top: 70px;
      }

      .booking-hero::after {
        display: none;
      }

      .booking-shell {
        width: min(calc(100% - 20px), 520px);
        gap: 58px;
        padding: 72px 0 70px;
      }

      .booking-copy h1 {
        font-size: clamp(2.45rem, 11vw, 3.8rem);
      }

      .calendar-frame {
        padding: 10px;
      }

      .calendar-embed-crop {
        height: 720px;
      }

      .calendar-frame iframe {
        height: 1040px !important;
        min-height: 1040px;
        transform: translateY(-92px);
      }





    }

    @media (prefers-reduced-motion: reduce) {
      *,
*::before,
*::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }





    }




  </style>

  <script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const header = document.querySelector('[data-header]');
      const progress = document.querySelector('[data-progress]');
      const navShell = document.querySelector('.nav-shell');
      const navToggle = document.querySelector('[data-nav-toggle]');
      const navLinks = document.querySelectorAll('.nav-links a');

      const updateScroll = () => {
        const maxScroll = Math.max(document.body.scrollHeight - window.innerHeight, 1);
        const ratio = Math.min(window.scrollY / maxScroll, 1);
        if (progress) progress.style.transform = `scaleX(${ratio})`;
        if (header) header.classList.toggle('is-scrolled', window.scrollY > 12);
      };

      updateScroll();
      window.addEventListener('scroll', updateScroll, { passive: true });

      if (navShell && navToggle) {
        const closeNav = () => {
          navShell.classList.remove('is-open');
          navToggle.setAttribute('aria-expanded', 'false');
          navToggle.setAttribute('aria-label', 'Open navigation menu');
        };

        navToggle.addEventListener('click', () => {
          const isOpen = navShell.classList.toggle('is-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
          navToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
        });

        navLinks.forEach((link) => link.addEventListener('click', closeNav));
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeNav();
        });
      }
    })();
  </script>
</body>
</html>
